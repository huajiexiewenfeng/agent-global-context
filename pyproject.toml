[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-global-context-runtime"
version = "0.4.3"
description = "Deterministic local runtime for Agent Global Context."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
trace = ["agent-trace-runtime>=0.1,<0.2"]
test = [
  "pytest==9.1.1",
  "build>=1.2,<2",
  "setuptools>=68",
  "wheel>=0.43",
  "mcp==2.0.0",
]

[project.scripts]
agc = "agc_runtime.cli:main"
agc-mcp = "agc_runtime.mcp_server:main"
agc-capture-hook = "agc_runtime.capture_hook:main"
agc-capture = "agc_runtime.capture_cli:main"

[tool.setuptools.packages.find]
include = ["agc_runtime*"]

[tool.setuptools.package-data]
agc_runtime = ["default_config.yaml", "UNICODE-LICENSE.txt"]
"*" = ["schemas/capture-extractor-v1.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
